services:
  db:
    image: postgis/postgis:15-master
    container_name: vpro_db
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: vpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vpro
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpro -d vpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: config/Dockerfile.backend
    container_name: vpro_api
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vpro:${POSTGRES_PASSWORD}@db:5432/vpro
      CORS_ORIGINS: http://localhost:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change_me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src/backend:/app
      - ../src/scripts:/app/scripts

  frontend:
    image: nginx:1.27-alpine
    container_name: vpro_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ../src/frontend:/usr/share/nginx/html:ro
      - ../config/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
