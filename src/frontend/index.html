<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7faf8">
    <title>V-PRO</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23057a55'/%3E%3Cpath d='M9 8h4l3 12 3-12h4l-5 16h-4L9 8z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./assets/app.css">
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="topbar">
        <div class="topbar-main">
          <div class="brand" aria-label="V-PRO">
            <span class="brand-mark">V</span>
            <span>V-PRO</span>
          </div>
          <nav class="profile-selector" aria-label="Perfil de movilidad" data-i18n-attr="aria-label:profileSelectorLabel">
            <button type="button" data-profile="GENERIC">Generico</button>
            <button type="button" data-profile="PMR">PMR</button>
            <button type="button" data-profile="CYCLIST">Bici</button>
            <button type="button" data-profile="PUBLIC_TRANSPORT">Transporte</button>
          </nav>
        </div>
        <div class="language-selector" aria-label="Idioma" data-i18n-attr="aria-label:languageSelectorLabel">
          <button type="button" data-lang="es">CAS</button>
          <button type="button" data-lang="val">VAL</button>
        </div>
      </header>

      <section class="context-panel">
        <p class="eyebrow" data-i18n="eyebrow">Valencia ahora</p>
        <h1 data-i18n="title">Lo que esta pasando cerca</h1>
        <p id="statusText" class="status-text" data-i18n="loading">Buscando acontecimientos activos...</p>
        <p class="project-note">
          <span data-i18n="projectNote">Demo para el concurso municipal de datos abiertos.</span>
          <a href="https://github.com/Huntsman1756/Valencia_Proactiva" target="_blank" rel="noopener" data-i18n="githubLink">GitHub</a>
        </p>
      </section>

      <nav class="view-tabs" aria-label="Secciones" data-i18n-attr="aria-label:viewTabsLabel">
        <button type="button" data-view="events" aria-pressed="true" data-i18n="tabEvents">Eventos</button>
        <button type="button" data-view="sources" aria-pressed="false" data-i18n="tabSources">Fuentes</button>
        <button type="button" data-view="methodology" aria-pressed="false" data-i18n="tabMethodology">Metodologia</button>
        <button type="button" data-view="info" aria-pressed="false" data-i18n="tabInfo">Info</button>
      </nav>

      <section class="event-list view-panel" data-panel="events" aria-label="Acontecimientos activos" data-i18n-attr="aria-label:eventListLabel">
        <div class="alternative-toolbar" aria-label="Tipo de alternativa" data-i18n-attr="aria-label:alternativeToolbarLabel">
          <span data-i18n="alternativeToolbarTitle">Alternativas</span>
          <div id="poiFilters" class="poi-filters"></div>
        </div>
        <div id="eventList" class="event-stack"></div>
      </section>

      <section id="sourcesPanel" class="view-panel info-panel" data-panel="sources" hidden></section>
      <section id="methodologyPanel" class="view-panel info-panel" data-panel="methodology" hidden></section>
      <section id="additionalInfoPanel" class="view-panel info-panel" data-panel="info" hidden></section>

      <section class="map-shell" aria-label="Mapa de eventos y alternativas" data-i18n-attr="aria-label:mapLabel">
        <div class="map-toolbar">
          <span data-i18n="map">Mapa</span>
          <button id="toggleMap" type="button" aria-expanded="false" data-i18n="expand">Expandir</button>
        </div>
        <div id="map" class="map-canvas"></div>
        <div class="map-legend" aria-label="Leyenda del mapa" data-i18n-attr="aria-label:mapLegendLabel">
          <span><i class="legend-dot legend-event"></i><span data-i18n="legendEvent">Evento activo</span></span>
          <span><i class="legend-dot legend-alternative"></i><span data-i18n="legendAlternative">Alternativa cercana</span></span>
          <span><i class="legend-line legend-traffic"></i><span data-i18n="legendTraffic">Tráfico</span></span>
          <span><i class="legend-zone"></i><span data-i18n="legendImpact">Zona de impacto</span></span>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>

    <noscript>V-PRO necesita JavaScript para mostrar eventos urbanos y alternativas cercanas.</noscript>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
